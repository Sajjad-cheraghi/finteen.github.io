<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/fav.png">


  <title>FINTEEN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap');
    *{
       font-family: "Fredoka", sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }

    .image-stack {
      max-width: 600px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .image-stack img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      transition: all .5s ease;
      
    }
    .footer{
      margin-top: -10%; /* overlap */
    }
    .image-stack .middle {
      margin-top: -20%; /* overlap */
      z-index: 2;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
      
    }

    .image-stack .middle:hover {

      
     
      transition: all 1s ease;
      opacity: .9;
    }
    
.pblock{
  display: block;
  width: 70%;
  padding: 10px;
  background-color: #ffffff71;
  font-weight: 700;
  color: #6A57FF;
text-align: center;
margin: 3rem 0;
border-radius: 50px;;
filter: drop-shadow(0 0 35px #ffffff)drop-shadow(0 0 35px #ffffff)drop-shadow(0 0 35px #ffffff);
z-index: -10;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.02); /* بزرگ‌تر شدن */
  }
  100% {
    transform: scale(1); /* بازگشت به حالت اولیه */
  }
}
  </style>
</head>
<body>

  <div class="image-stack">
    <img src="images/top.png" alt="FINTEEN" style="border-radius: 25px;">
    
    <a href="Finteen.apk" download>
      <img src="images/center.png" alt="FINTEEN" class="middle">
    </a>
    <div class="pblock">
    <h3>
      YOUR MONEY. YOUR GAME. YOUR FUTURE.
    </h3>
    </div>
    <img src="images/footer.png" class="footer" alt="FINTEEN">
  </div>

</body>
</html>
